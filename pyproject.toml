[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "stellar-jax"
version = "0.1.0"
description = "Differentiable 1D stellar evolution in JAX with analytic gradients."
readme = "README.md"
requires-python = ">=3.11"
# Pinned to match requirements.txt for reproducibility (JAX float results are version-sensitive).
# matplotlib is a core dependency because the collaborator demos (demos/) generate figures.
dependencies = ["jax==0.10.2", "jaxlib==0.10.2", "numpy>=1.24", "matplotlib>=3.7"]
# NOTE: no license declared (maintainer choice).

[project.optional-dependencies]
# Retained for back-compat; matplotlib is now a core dependency (above).
validation = ["matplotlib"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
stellar_jax = ["data/**/*"]

[tool.setuptools.exclude-package-data]
# data/ferguson_raw/*.tron are raw build inputs for tools/build_ferguson_4d.py; runtime uses the
# built data/ferguson_4d.npz, so the raw tables should not ship in the wheel.
stellar_jax = ["data/ferguson_raw/**"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
